<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Sans+3:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="fig" viewBox="0 0 24 26"><circle cx="12" cy="6" r="4.6"/><path d="M3.5 26v-5.5a8.5 8.5 0 0 1 17 0V26z"/></symbol>
</svg>

<div class="bar"><div class="bar-in">
  <span class="brand">Prototype</span>
  <span class="spacer"></span>
  <button class="sos" id="sos" type="button">Support</button>
</div></div>

<main class="wrap">
  <header class="intro">
    <h1>[PLACEHOLDER]</h1>
    <p class="tip">Includes statistics about sexual harassment and sexual violence.</p>
  </header>

  <nav class="deck" aria-label="Questions">
    <span class="deck-label">Pick any question <span id="prog">(0 of 3 revealed)</span></span>
    <div class="chips" id="chips"></div>
  </nav>

  <article class="stage" id="stage"></article>

  <section class="results" id="results" aria-labelledby="rh">
    <h2 class="sect" id="rh">Your blind spots</h2>
    <p class="sectlede">Where your guesses landed next to the real numbers. Tap a row to go back to that question.</p>
    <div class="sum" id="sum"></div>
    <div class="key" aria-hidden="true"><span><i class="kd you"></i>Your guess</span><span><i class="kd real"></i>Real number</span></div>
    <div class="rows" id="rows"></div>
    <div class="axis-wrap" aria-hidden="true">
      <div class="axis"><span style="left:0%">0</span><span style="left:25%">25</span><span style="left:50%">50</span><span style="left:75%">75</span><span style="left:100%">100</span></div>
      <div class="axis"><span style="left:0%">0</span><span style="left:25%">25</span><span style="left:50%">50</span><span style="left:75%">75</span><span style="left:100%">100</span></div>
    </div>
    <button class="btn ghost" id="reset" type="button" hidden>Start over</button>
  </section>

  <footer class="foot"></footer>
</main>


<!-- Scripts load in this order. Each one can use what the ones before it define. -->
<script src="js/questions.js"></script>
<script src="js/state.js"></script>
<script src="js/chips.js"></script>
<script src="js/stage.js"></script>
<script src="js/results.js"></script>
<script src="js/support.js"></script>
<script src="js/main.js"></script>
</body>
</html>
