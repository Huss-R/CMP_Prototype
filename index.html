<!doctype html>
<html lang="en-AU" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<style>
/* Home page: links to the two prototypes. Colours come from statistics/css/theme.css. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.bar{background:var(--head);color:var(--head-ink)}
.bar div,main{max-width:760px;margin:0 auto;padding-left:16px;padding-right:16px}
.bar div{padding-block:12px;font-weight:700;font-size:1.15rem}
main{padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:2.2rem;line-height:1.15}
p{margin:0}
.lede{font-size:1.15rem;max-width:60ch}
.cards{display:grid;gap:12px}
.card{display:block;border:1px solid var(--line);border-top:4px solid var(--you);border-radius:4px;padding:16px 18px;color:var(--ink);text-decoration:none}
.card:hover{background:var(--you-soft)}
.card:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.card strong{display:block;font-size:1.25rem;color:var(--you);text-decoration:underline;text-underline-offset:2px}
.foot{font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="bar"><div>Prototype</div></div>
<main>
  <h1>Two prototypes</h1>
  <p class="lede">Short versions of two ideas, made to show how each one works.</p>
  <div class="cards">
    <a class="card" href="statistics/"><strong>The numbers</strong>Compare your perceptions with statistical data.</a>
    <a class="card" href="practice/"><strong>Practise your response</strong>Practice the ability to quickly respond.</a>
  </div>
  <p class="foot"></p>
</main>
</body>
</html>
